name: Legacy images

# The previous images, lg-baseimg (Debian bookworm-slim) and lg-flaskimg, kept building every Sunday so that
# anything still using them keeps getting security updates while it moves to lg-base / lg-python.
# Retire this file, and legacy/, when nothing pulls them any more.

on:
  push:
    branches: [main]
    paths: ['legacy/**', '.github/workflows/legacy.yml']
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./legacy/base/
          platforms: linux/amd64,linux/arm64
          tags: lgirardi/lg-baseimg:edge
          push: true

  legacy-flask:
    needs: legacy-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./legacy/flask/
          platforms: linux/amd64,linux/arm64
          tags: lgirardi/lg-flaskimg:edge
          push: true
